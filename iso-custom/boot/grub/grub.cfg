menuentry "Install AI Rig (AUTO - catena 3 ruoli)" {
    set gfxpayload=keep
    linux /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/auto/ ---
    initrd /casper/initrd
}
menuentry "Install AI Rig - DEVIN" {
    set gfxpayload=keep
    linux /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/devin/ ---
    initrd /casper/initrd
}
menuentry "Install AI Rig - HERMES" {
    set gfxpayload=keep
    linux /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/hermes/ ---
    initrd /casper/initrd
